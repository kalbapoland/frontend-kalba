name: CI — Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "scripts/*.js"
      - "scripts/__tests__/**"
      - "eas.json"
      - "jest.setup.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "app.config.js"
      - "tailwind.config.js"
      - "metro.config.js"
      - "global.css"
      - "nativewind-env.d.ts"
      - "android/app/src/main/AndroidManifest.xml"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "scripts/*.js"
      - "scripts/__tests__/**"
      - "eas.json"
      - "jest.setup.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "app.config.js"
      - "tailwind.config.js"
      - "metro.config.js"
      - "global.css"
      - "nativewind-env.d.ts"
      - "android/app/src/main/AndroidManifest.xml"
      - ".github/workflows/ci-frontend.yml"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  test:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --watchAll=false
