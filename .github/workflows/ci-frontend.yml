name: CI — Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "app.config.js"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "app.config.js"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  test:
    name: Jest
    runs-on: ubuntu-latest
    # TODO: Usuń 'if' gdy zostaną dodane pierwsze testy (npm install jest-expo @testing-library/react-native)
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
