appId: com.kalba.app
---
# SMOKE: Trainer delete-flow — usunięcie warsztatu z potwierdzeniem
#
# Co testuje:
#   1. Trainer może zalogować się i nawigować do warsztatu w grupie
#   2. Ekran szczegółów warsztatu pokazuje przycisk "Usuń" (widoczny tylko dla właściciela)
#   3. Tapnięcie "Usuń" wyświetla dialog potwierdzenia
#   4. Potwierdzenie usunięcia wysyła DELETE /workshops/{id} i wraca do group detail
#   5. Wiersz warsztatu znika z listy w grupie (cache odświeżony po DELETE)
#
# Zależność: musi być uruchomiony po trainer_edit_group_smoke.yaml, który zmienia tytuł grupy.
#   Używa zaktualizowanego sluga: e2e-trainer-group-smoke-updated.
#
# Dane wejściowe:
#   - konto trainera: e2e.trainer@kalba.dev / Pass1234
#   - istniejąca grupa: "E2E Trainer Group Smoke Updated" (po edycji w trainer_edit_group_smoke)
#   - istniejący warsztat: "E2E Owner Workshop Smoke Updated" (edytowany przez trainer_edit_workshop_smoke)

- launchApp:
    clearState: true

# --- Logowanie jako trainer ---
- runFlow: ../common/login_trainer.yaml

# --- Nawigacja do warsztatu ---
# Weryfikacja: karta grupy jest widoczna
- tapOn:
    id: tab.groups.button
- extendedWaitUntil:
    visible:
      id: group.card.e2e-trainer-group-smoke-updated
    timeout: 15000

# Weryfikacja: wiersz warsztatu jest widoczny w grupie
- tapOn:
    id: group.card.e2e-trainer-group-smoke-updated
- extendedWaitUntil:
    visible:
      id: group.workshop.row.e2e-owner-workshop-smoke-updated
    timeout: 15000

# Weryfikacja: ekran szczegółów warsztatu pokazuje przycisk usunięcia (tylko dla właściciela)
- tapOn:
    id: group.workshop.row.e2e-owner-workshop-smoke-updated
- extendedWaitUntil:
    visible:
      id: trainer.delete.workshop.button
    timeout: 10000

# --- Usunięcie warsztatu ---
# Tapnięcie "Usuń" otwiera alert z potwierdzeniem
- tapOn:
    id: trainer.delete.workshop.button

# Weryfikacja: dialog potwierdzenia jest widoczny
- extendedWaitUntil:
    visible:
      text: "Delete Workshop"
    timeout: 5000

# Potwierdzenie usunięcia — tapnięcie "Delete" wysyła DELETE /workshops/{id}
- tapOn:
    text: "Delete"

# --- Weryfikacja usunięcia ---
# Po usunięciu router.back() wraca do group detail.
# Czekamy na landmark grupy (przycisk tworzenia warsztatu) zanim sprawdzimy brak wiersza.
- extendedWaitUntil:
    visible:
      id: trainer.create.workshop.button
    timeout: 15000

# Weryfikacja: wiersz warsztatu zniknął z listy (DELETE /workshops/{id} zadziałał, cache odświeżony)
- assertNotVisible:
    id: group.workshop.row.e2e-owner-workshop-smoke-updated
