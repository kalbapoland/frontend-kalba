appId: com.kalba.app
---
# SMOKE: Trainer edit-flow — edycja istniejącego warsztatu z weryfikacją zapisu
#
# Co testuje:
#   1. Trainer może zalogować się od zera (clearState) i nawigować do swoich grup
#   2. Karta grupy "E2E Trainer Group Smoke" jest widoczna na liście grup trenera
#   3. Po wejściu do grupy warsztat "E2E Owner Workshop Smoke" jest widoczny na liście
#   4. Ekran szczegółów warsztatu ładuje przycisk edycji dla właściciela
#   5. Formularz edycji otwiera się i przyjmuje zmiany we wszystkich polach liczbowych
#   6. Po zapisaniu ekran szczegółów warsztatu wraca (PATCH /workshops/{id} zwrócił 200)
#   7. Ponowne otwarcie formularza edycji pokazuje nowe wartości — zapis w DB potwierdzony:
#      - czas trwania: 45 → 60 min
#      - cena: 0 → 25
#      - max uczestników: 12 → 8
#
# Zależność: musi być uruchomiony po trainer_smoke.yaml, który tworzy grupę i warsztat.
#
# Dane wejściowe:
#   - konto trainera: e2e.trainer@kalba.dev / Pass1234
#   - istniejąca grupa: "E2E Trainer Group Smoke" (stworzona przez trainer_smoke)
#   - istniejący warsztat: "E2E Owner Workshop Smoke" (stworzony przez trainer_smoke)

- launchApp:
    clearState: true

# --- Logowanie jako trainer (świeże uruchomienie) ---
- runFlow: ../common/login_trainer.yaml

# --- Nawigacja do warsztatu ---
# Weryfikacja: zakładka Grupy pokazuje listę z kartą "E2E Trainer Group Smoke"
- tapOn:
    id: tab.groups.button
- extendedWaitUntil:
    visible:
      id: group.card.e2e-trainer-group-smoke
    timeout: 15000

# Weryfikacja: po wejściu do grupy warsztat jest widoczny na liście
- tapOn:
    id: group.card.e2e-trainer-group-smoke
- extendedWaitUntil:
    visible:
      id: group.workshop.row.e2e-owner-workshop-smoke
    timeout: 15000

# Weryfikacja: ekran szczegółów warsztatu ładuje przycisk edycji (widoczny tylko dla właściciela)
- tapOn:
    id: group.workshop.row.e2e-owner-workshop-smoke
- extendedWaitUntil:
    visible:
      id: trainer.edit.workshop.button
    timeout: 10000

# --- Edycja warsztatu — zmiana wszystkich pól liczbowych ---
# Weryfikacja: formularz edycji otwiera się po tapnięciu przycisku edycji
- tapOn:
    id: trainer.edit.workshop.button
- extendedWaitUntil:
    visible:
      id: workshop.edit.submit.button
    timeout: 10000

# Zmiana czasu trwania: 45 → 60 min
- tapOn:
    id: workshop.edit.duration.input
- eraseText: 10
- inputText: "60"
- hideKeyboard

# Zmiana ceny: 0 → 25
- tapOn:
    id: workshop.edit.price.input
- eraseText: 10
- inputText: "25"
- hideKeyboard

# Zmiana max uczestników: 12 → 8
- tapOn:
    id: workshop.edit.max-participants.input
- eraseText: 10
- inputText: "8"
- hideKeyboard

# Submit — weryfikacja że PATCH /workshops/{id} działa i nawigacja wraca poprawnie
- tapOn:
    id: workshop.edit.submit.button

# Weryfikacja: po zapisaniu powrót do ekranu szczegółów warsztatu
- extendedWaitUntil:
    visible:
      id: trainer.edit.workshop.button
    timeout: 15000

# --- Weryfikacja trwałości zapisu w DB ---
# Otwieramy formularz edycji ponownie i sprawdzamy czy nowe wartości zostały załadowane z serwera
- tapOn:
    id: trainer.edit.workshop.button
- extendedWaitUntil:
    visible:
      id: workshop.edit.submit.button
    timeout: 10000

# Weryfikacja: pole "czas trwania" pokazuje 60 (zamiast oryginalnych 45)
- assertVisible:
    text: "60"

# Weryfikacja: pole "cena" pokazuje 25 (zamiast oryginalnego 0)
- assertVisible:
    text: "25"

# Weryfikacja: pole "max uczestników" pokazuje 8 (zamiast oryginalnych 12)
- assertVisible:
    text: "8"
