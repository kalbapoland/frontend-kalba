appId: com.kalba.app
---
# SMOKE: user_forgot_password — przepływ "Forgot password" do ekranu sukcesu
#
# Co testuje:
#   1. Z ekranu logowania link "Forgot password?" otwiera forgot-password screen
#   2. Formularz resetowania hasła przyjmuje email i wysyła żądanie (POST /auth/forgot-password)
#   3. Backend zawsze zwraca 202 (bez ujawniania czy konto istnieje)
#   4. Po submit pojawia się komunikat sukcesu ("If an account exists...")
#   5. Przycisk "Back to Log In" (forgot.back.button) wraca na ekran logowania
#
# Uwaga: nie testuje pełnego reset flow (wymagałby tokenu z emaila).
#   Smoke kończy się na potwierdzeniu wysłania linka.
#
# Zależność: standalone — nie wymaga danych w DB.
#
# Dane wejściowe:
#   - email: e2e.user@kalba.dev (ma konto z seeda)

- launchApp:
    clearState: true

# Ekran logowania pojawia się automatycznie po clearState
- extendedWaitUntil:
    visible:
      id: signin.email.input
    timeout: 15000

# --- Otwarcie forgot password screen ---
# Weryfikacja: tapnięcie "Forgot password?" otwiera ekran resetowania
- tapOn:
    id: signin.forgot.button
- extendedWaitUntil:
    visible:
      id: forgot.email.input
    timeout: 10000

# --- Wypełnienie emaila i submit ---
- tapOn:
    id: forgot.email.input
- inputText: "e2e.user@kalba.dev"
- hideKeyboard

# Tapnięcie "Send reset link" → POST /auth/forgot-password → 202
- tapOn:
    id: forgot.submit.button

# --- Weryfikacja ekranu sukcesu ---
# Po 202 ekran przechodzi do widoku z komunikatem (submitted=true)
# forgot.back.button jest też na tym widoku (zamiast forgot.submit.button)
- extendedWaitUntil:
    visible:
      id: forgot.back.button
    timeout: 15000

# Weryfikacja: komunikat sukcesu widoczny
- assertVisible:
    text: ".*account exists.*"

# --- Powrót do logowania ---
# Tapnięcie "Back to Log In" wraca na ekran logowania
- tapOn:
    id: forgot.back.button
- extendedWaitUntil:
    visible:
      id: signin.email.input
    timeout: 10000
