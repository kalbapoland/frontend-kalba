appId: com.kalba.app
---
# SMOKE: user_workshop_full — warsztat pełny: enroll button widoczny, przyciski trainera niewidoczne
#
# Co testuje:
#   1. User loguje się i widzi "E2E Workshop Full" na home feed
#      (user jest już członkiem E2E Trainer Group z seeda, workshop_full jest w tej grupie)
#   2. Ekran szczegółów warsztatu pokazuje workshop.enroll.button (not enrolled state)
#      (enrolled_count == max_participants == 1, fuller już zapisany → isFull=true)
#   3. User nie jest właścicielem — przyciski edit/delete niewidoczne
#
# Prereq: seed_mobile_e2e_fixtures.py
#   - workshop_full: max_participants=1, fuller enrolled → isFull=true
#   - user jest członkiem E2E Trainer Group → widzi workshop w home feed
#
# Dane wejściowe:
#   - konto usera: e2e.user@kalba.dev / Pass1234
#   - warsztat: "E2E Workshop Full" (slug: e2e-workshop-full)

- launchApp:
    clearState: true

# --- Logowanie jako user ---
- runFlow: ../common/login_user.yaml

# --- Nawigacja do warsztatu ---
# Weryfikacja: "E2E Workshop Full" jest widoczny na home feed
- tapOn:
    id: tab.index.button
- extendedWaitUntil:
    visible:
      id: home.workshop.card.e2e-workshop-full
    timeout: 15000

# Tapnięcie karty → ekran szczegółów warsztatu
- tapOn:
    id: home.workshop.card.e2e-workshop-full
- extendedWaitUntil:
    visible:
      id: workshop.enroll.button
    timeout: 15000

# --- Weryfikacja stanu Full ---
# workshop.enroll.button widoczny (not enrolled state, isFull=true)
# Tekst przycisku ("Full" / "Brak miejsc") nie jest asercjonowany — zależy od locale urządzenia

# Przyciski właściciela są niewidoczne — user nie jest trainerem tego warsztatu
- assertNotVisible:
    id: trainer.edit.workshop.button
- assertNotVisible:
    id: trainer.delete.workshop.button
