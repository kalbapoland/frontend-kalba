appId: com.kalba.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: signin.email.input
    timeout: 15000
- takeScreenshot: 01-sign-in

# Register switch: wait for the button to be stable before tapping, then
# require the name input with a generous window — the first render after a
# cold start may re-layout (runtime theme pipeline) and a bare tap can land
# before the Pressable's handler is attached.
- extendedWaitUntil:
    visible:
      id: signin.mode.register.button
    timeout: 5000
- tapOn:
    id: signin.mode.register.button
- extendedWaitUntil:
    visible:
      id: signin.name.input
    timeout: 10000
- takeScreenshot: 02-sign-up

- tapOn:
    id: signin.mode.login.button
- tapOn:
    id: signin.forgot.button
- extendedWaitUntil:
    visible:
      id: forgot.email.input
    timeout: 5000
- takeScreenshot: 03-forgot-password

- openLink:
    link: "kalba://reset-password?token=screenflow-invalid"
- extendedWaitUntil:
    visible:
      id: reset.password.input
    timeout: 10000
- takeScreenshot: 04-reset-password

- openLink:
    link: "kalba://oauthredirect"
- waitForAnimationToEnd
- takeScreenshot: 05-oauth-redirect

- runFlow: ../common/login_user.yaml
- extendedWaitUntil:
    visible:
      id: home.workshop.card.e2e-workshop-free
    timeout: 15000
- takeScreenshot: 06-home-user

- tapOn:
    id: tab.groups.button
- extendedWaitUntil:
    visible:
      id: group.card.e2e-trainer-group
    timeout: 15000
- takeScreenshot: 07-groups-user

- tapOn:
    id: group.card.e2e-trainer-group
- extendedWaitUntil:
    visible:
      id: group.unsubscribe.button
    timeout: 10000
- takeScreenshot: 08-group-detail-member

- pressKey: Back
- tapOn:
    id: tab.index.button
- extendedWaitUntil:
    visible:
      id: home.workshop.card.e2e-workshop-free
    timeout: 10000
- tapOn:
    id: home.workshop.card.e2e-workshop-free
- extendedWaitUntil:
    visible:
      id: workshop.unenroll.button
    timeout: 15000
- takeScreenshot: 09-workshop-detail-member

- pressKey: Back
- tapOn:
    id: tab.my-kalba.button
- extendedWaitUntil:
    visible:
      id: my-kalba.schedule.item.e2e-workshop-free
    timeout: 15000
- takeScreenshot: 10-my-kalba

- tapOn:
    id: tab.calendar.button
- extendedWaitUntil:
    visible:
      id: calendar.content
    timeout: 15000
- takeScreenshot: 11-calendar-month
- tapOn:
    id: calendar.mode.week
- waitForAnimationToEnd
- takeScreenshot: 12-calendar-week
- tapOn:
    id: calendar.mode.day
- waitForAnimationToEnd
- takeScreenshot: 13-calendar-day

- tapOn:
    id: tab.profile.button
- extendedWaitUntil:
    visible:
      id: profile.editname.button
    timeout: 10000
- takeScreenshot: 14-profile-user
