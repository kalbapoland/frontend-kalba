appId: com.kalba.app
---
# Verify the Appearance switch (ON/OFF) + dev options interplay on a test build.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: signin.email.input
    timeout: 15000
- runFlow: ../common/login_user.yaml
- extendedWaitUntil:
    visible:
      id: home.workshops.list
    timeout: 15000
- tapOn:
    id: tab.profile.button
- extendedWaitUntil:
    visible:
      id: profile.appearance.section
    timeout: 10000
- takeScreenshot: sw-01-defaults

# Switch OFF: pin light regardless of OS.
- tapOn:
    id: profile.appearance.switch
- extendedWaitUntil:
    visible:
      id: profile.appearance.section
    timeout: 5000
- takeScreenshot: sw-02-switch-off

# Switch back ON: follow system.
- tapOn:
    id: profile.appearance.switch
- extendedWaitUntil:
    visible:
      id: profile.appearance.section
    timeout: 5000
- takeScreenshot: sw-03-switch-on

# Dev options: night override still wins over the switch.
- tapOn:
    id: profile.theme.option.night
- extendedWaitUntil:
    visible:
      id: profile.devoptions.section
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: sw-04-night-override

# Clear override — back to switch policy (ON = system).
- tapOn:
    id: profile.theme.option.none
- extendedWaitUntil:
    visible:
      id: profile.appearance.section
    timeout: 5000
- takeScreenshot: sw-05-final